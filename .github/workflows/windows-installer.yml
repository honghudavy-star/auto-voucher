name: Windows launcher candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [pilot, stable]
        default: pilot
      rollout:
        description: Rollout percentage
        default: "5"
      minimumVersion:
        description: Minimum allowed core version
        default: "0.2.0"
      minimumLauncherVersion:
        description: Minimum allowed launcher version
        default: "0.2.0"
      publish:
        description: Publish verified unsigned artifacts to configured Cloudflare R2
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: auto-voucher-windows-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    environment:
      name: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'release' || 'candidate' }}
    permissions:
      contents: read
    env:
      AUTO_VOUCHER_RELEASE_PRIVATE_KEY: ${{ secrets.AUTO_VOUCHER_RELEASE_PRIVATE_KEY }}
      AUTO_VOUCHER_CORE_BASE_URL: ${{ vars.AUTO_VOUCHER_CORE_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      AUTO_VOUCHER_R2_BUCKET: ${{ vars.AUTO_VOUCHER_R2_BUCKET }}
      AUTO_VOUCHER_R2_PREFIX: ${{ vars.AUTO_VOUCHER_R2_PREFIX }}
      AUTO_VOUCHER_PUBLIC_UPDATE_BASE_URL: ${{ vars.AUTO_VOUCHER_PUBLIC_UPDATE_BASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan repository for leaked secrets
        shell: pwsh
        run: |
          $version = "8.30.1"
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks-$version-windows-x64.zip"
          $download = "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip"
          Invoke-WebRequest -UseBasicParsing $download -OutFile $archive
          $expected = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Gitleaks archive checksum mismatch" }
          $install = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          Expand-Archive -Path $archive -DestinationPath $install -Force
          & (Join-Path $install "gitleaks.exe") git . --redact --no-banner
          if ($LASTEXITCODE -ne 0) { throw "Gitleaks found a leak or failed to scan the repository" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: launcher/go.mod
          cache: false

      - run: npm ci
      - name: Install locked Python release environment
        run: |
          python -m pip install --upgrade pip==26.1.2 uv==0.10.11
          uv sync --frozen --group release
      - run: npm test
      - name: Test backend against locked environment
        env:
          PYTHONPATH: backend
        run: uv run --frozen --group release python -m unittest discover -s backend/tests -v
      - run: npm run build
      - name: Audit locked Python dependencies
        run: uv run --frozen --group release pip-audit --progress-spinner off --skip-editable
      - name: Lint GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/windows-installer.yml
      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $channel = if ("${{ inputs.channel }}") { "${{ inputs.channel }}" } else { "stable" }
          $rollout = if ("${{ inputs.rollout }}") { "${{ inputs.rollout }}" } else { "5" }
          if ($channel -notin @("pilot", "stable")) { throw "Channel must be pilot or stable" }
          $rolloutNumber = 0
          if (-not [int]::TryParse($rollout, [ref]$rolloutNumber) -or $rolloutNumber -lt 0 -or $rolloutNumber -gt 100) {
            throw "Rollout must be an integer between 0 and 100"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $version) { throw "Tag $($env:GITHUB_REF_NAME) does not match project version $version" }
            $mainSha = (git rev-parse origin/main).Trim()
            if ($env:GITHUB_SHA -ne $mainSha) { throw "Release tag must point to the current origin/main commit" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "rollout=$rolloutNumber" >> $env:GITHUB_OUTPUT
          $minimumVersion = if ("${{ inputs.minimumVersion }}") { "${{ inputs.minimumVersion }}" } else { $version }
          if ([version]$minimumVersion -gt [version]$version) { throw "minimumVersion cannot be newer than release version" }
          "minimum_version=$minimumVersion" >> $env:GITHUB_OUTPUT
          $minimumLauncherVersion = if ("${{ inputs.minimumLauncherVersion }}") { "${{ inputs.minimumLauncherVersion }}" } else { "0.2.0" }
          "minimum_launcher_version=$minimumLauncherVersion" >> $env:GITHUB_OUTPUT
          $databaseVersion = (Select-String -Path backend\auto_voucher\database.py -Pattern '^DATABASE_SCHEMA_VERSION = ([0-9]+)$').Matches[0].Groups[1].Value
          if (-not $databaseVersion) { throw "DATABASE_SCHEMA_VERSION was not found" }
          "database_version=$databaseVersion" >> $env:GITHUB_OUTPUT

      - name: Resolve manifest signing key
        id: signing
        working-directory: launcher
        shell: pwsh
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP "auto-voucher-release-private-key"
          go run ./cmd/keygen -private-out $keyFile | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          "key_file=$keyFile" >> $env:GITHUB_OUTPUT

      - name: Enforce formal release credentials
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.ephemeral }}" -eq "true") { throw "Formal releases require AUTO_VOUCHER_RELEASE_PRIVATE_KEY" }
          if (-not $env:AUTO_VOUCHER_CORE_BASE_URL) { throw "Formal releases require AUTO_VOUCHER_CORE_BASE_URL" }
          if (-not $env:CLOUDFLARE_ACCOUNT_ID -or -not $env:AWS_ACCESS_KEY_ID -or -not $env:AWS_SECRET_ACCESS_KEY) { throw "Formal releases require bucket-scoped R2 credentials" }
          if (-not $env:AUTO_VOUCHER_R2_BUCKET -or -not $env:AUTO_VOUCHER_R2_PREFIX -or -not $env:AUTO_VOUCHER_PUBLIC_UPDATE_BASE_URL) { throw "Formal releases require R2 bucket, object prefix and public update URL" }
          $prefix = $env:AUTO_VOUCHER_R2_PREFIX.Trim("/")
          if ($prefix -notmatch "^[A-Za-z0-9][A-Za-z0-9._/-]*[A-Za-z0-9]$" -or $prefix -match "(^|/)\.\.(/|$)") {
            throw "AUTO_VOUCHER_R2_PREFIX is not a safe object prefix"
          }
          $publicPath = ([uri]$env:AUTO_VOUCHER_PUBLIC_UPDATE_BASE_URL).AbsolutePath.Trim("/")
          if ($publicPath -ne $prefix) { throw "Public update URL path must match AUTO_VOUCHER_R2_PREFIX" }

      - name: Build core without optional OCR
        run: uv run --frozen --group release pyinstaller --distpath dist-pyinstaller --workpath build-pyinstaller --noconfirm packaging/auto-voucher.spec

      - name: Build optional OCR and PDF components
        shell: pwsh
        run: |
          uv sync --frozen --all-extras --group release
          uv run --frozen --all-extras --group release pip-audit --progress-spinner off --skip-editable
          uv run --frozen --all-extras --group release pyinstaller --distpath dist-ocr --workpath build-ocr --noconfirm packaging/auto-voucher-ocr.spec
          uv run --frozen --all-extras --group release pyinstaller --distpath dist-pdf --workpath build-pdf --noconfirm packaging/auto-voucher-pdf.spec

      - name: Package versioned components
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist-pyinstaller\AutoVoucherCore.exe -DestinationPath "release\AutoVoucherCore-${{ steps.release.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist-ocr\AutoVoucherOCR.exe -DestinationPath "release\AutoVoucherOCR-${{ steps.release.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist-pdf\AutoVoucherPDF.exe -DestinationPath "release\AutoVoucherPDF-${{ steps.release.outputs.version }}-windows-x64.zip"

      - name: Build lightweight launcher
        shell: pwsh
        run: |
          $manifestUrl = if ($env:AUTO_VOUCHER_CORE_BASE_URL) { "$($env:AUTO_VOUCHER_CORE_BASE_URL.TrimEnd('/'))/${{ steps.release.outputs.channel }}/manifest.json" } else { "https://invalid.local/auto-voucher/${{ steps.release.outputs.channel }}/manifest.json" }
          .\scripts\build-windows-launcher.ps1 `
            -Version "${{ steps.release.outputs.version }}" `
            -Channel "${{ steps.release.outputs.channel }}" `
            -ManifestUrl $manifestUrl `
            -ManifestPublicKey "${{ steps.signing.outputs.public_key }}" `
            -Output "release\AutoVoucherLauncher.exe"

      - name: Generate signed version manifest
        working-directory: launcher
        shell: pwsh
        env:
          AUTO_VOUCHER_RELEASE_PRIVATE_KEY_FILE: ${{ steps.signing.outputs.key_file }}
        run: |
          $base = if ($env:AUTO_VOUCHER_CORE_BASE_URL) { $env:AUTO_VOUCHER_CORE_BASE_URL.TrimEnd('/') } else { "https://invalid.local/auto-voucher" }
          go run ./cmd/manifest `
            -version "${{ steps.release.outputs.version }}" `
            -channel "${{ steps.release.outputs.channel }}" `
            -rollout "${{ steps.release.outputs.rollout }}" `
            -minimum-version "${{ steps.release.outputs.minimum_version }}" `
            -minimum-launcher-version "${{ steps.release.outputs.minimum_launcher_version }}" `
            -database-version "${{ steps.release.outputs.database_version }}" `
            -notes "在线轻量启动、环境检测、自动更新与一键诊断" `
            -core "..\release\AutoVoucherCore-${{ steps.release.outputs.version }}-windows-x64.zip" `
            -core-url "$base/${{ steps.release.outputs.channel }}/AutoVoucherCore-${{ steps.release.outputs.version }}-windows-x64.zip" `
            -ocr "..\release\AutoVoucherOCR-${{ steps.release.outputs.version }}-windows-x64.zip" `
            -ocr-url "$base/${{ steps.release.outputs.channel }}/AutoVoucherOCR-${{ steps.release.outputs.version }}-windows-x64.zip" `
            -pdf "..\release\AutoVoucherPDF-${{ steps.release.outputs.version }}-windows-x64.zip" `
            -pdf-url "$base/${{ steps.release.outputs.channel }}/AutoVoucherPDF-${{ steps.release.outputs.version }}-windows-x64.zip" `
            -output "..\release\manifest.json"

      - name: Build per-user bootstrap installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.release.outputs.version }}" packaging\AutoVoucher.iss

      - name: Publish verified update objects to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        run: |
          if (-not $env:CLOUDFLARE_ACCOUNT_ID -or -not $env:AWS_ACCESS_KEY_ID -or -not $env:AWS_SECRET_ACCESS_KEY) { throw "R2 publish requires bucket-scoped S3 credentials" }
          if (-not $env:AUTO_VOUCHER_R2_BUCKET -or -not $env:AUTO_VOUCHER_R2_PREFIX -or -not $env:AUTO_VOUCHER_PUBLIC_UPDATE_BASE_URL) { throw "R2 publish requires bucket, object prefix and public base URL" }
          if ($env:AUTO_VOUCHER_PUBLIC_UPDATE_BASE_URL.TrimEnd('/') -ne $env:AUTO_VOUCHER_CORE_BASE_URL.TrimEnd('/')) { throw "Public readback URL must match the URL embedded in the signed manifest" }
          aws --version
          if ($LASTEXITCODE -ne 0) { throw "AWS CLI v2 is required on the release runner" }
          $endpoint = "https://$env:CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          $prefix = $env:AUTO_VOUCHER_R2_PREFIX.Trim("/")
          $channel = "${{ steps.release.outputs.channel }}"
          $version = "${{ steps.release.outputs.version }}"
          $setup = (Get-ChildItem "release\AutoVoucher-Setup-$version-windows-x64.exe" | Select-Object -First 1).FullName
          foreach ($item in @(
            @{ key="$prefix/$channel/AutoVoucherCore-$version-windows-x64.zip"; file="release\AutoVoucherCore-$version-windows-x64.zip"; type="application/zip"; cache="public, max-age=31536000, immutable" },
            @{ key="$prefix/$channel/AutoVoucherOCR-$version-windows-x64.zip"; file="release\AutoVoucherOCR-$version-windows-x64.zip"; type="application/zip"; cache="public, max-age=31536000, immutable" },
            @{ key="$prefix/$channel/AutoVoucherPDF-$version-windows-x64.zip"; file="release\AutoVoucherPDF-$version-windows-x64.zip"; type="application/zip"; cache="public, max-age=31536000, immutable" },
            @{ key="$prefix/$channel/AutoVoucherLauncher-$version-windows-x64.exe"; file="release\AutoVoucherLauncher.exe"; type="application/vnd.microsoft.portable-executable"; cache="public, max-age=31536000, immutable" },
            @{ key="$prefix/$channel/AutoVoucher-Setup-$version-windows-x64.exe"; file=$setup; type="application/vnd.microsoft.portable-executable"; cache="public, max-age=31536000, immutable" },
            @{ key="$prefix/$channel/manifest.json.sig"; file="release\manifest.json.sig"; type="text/plain"; cache="no-store" }
          )) {
            aws s3api put-object --no-cli-pager --endpoint-url $endpoint --bucket $env:AUTO_VOUCHER_R2_BUCKET --key $item.key --body $item.file --content-type $item.type --cache-control $item.cache
            if ($LASTEXITCODE -ne 0) { throw "R2 upload failed for $($item.key)" }
          }
          # Publish the signed manifest last so clients never observe references to missing packages.
          aws s3api put-object --no-cli-pager --endpoint-url $endpoint --bucket $env:AUTO_VOUCHER_R2_BUCKET --key "$prefix/$channel/manifest.json" --body "release\manifest.json" --content-type "application/json" --cache-control "no-store"
          if ($LASTEXITCODE -ne 0) { throw "R2 manifest upload failed" }

      - name: Read back published manifest and package metadata
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        run: |
          $base = $env:AUTO_VOUCHER_PUBLIC_UPDATE_BASE_URL.TrimEnd('/')
          $channel = "${{ steps.release.outputs.channel }}"
          $remoteManifest = (Invoke-WebRequest -UseBasicParsing "$base/$channel/manifest.json").Content
          $localManifest = Get-Content "release\manifest.json" -Raw
          if ($remoteManifest.Trim() -ne $localManifest.Trim()) { throw "Published manifest readback differs from signed local manifest" }
          foreach ($file in @(
            "AutoVoucherCore-${{ steps.release.outputs.version }}-windows-x64.zip",
            "AutoVoucherOCR-${{ steps.release.outputs.version }}-windows-x64.zip",
            "AutoVoucherPDF-${{ steps.release.outputs.version }}-windows-x64.zip",
            "AutoVoucherLauncher-${{ steps.release.outputs.version }}-windows-x64.exe",
            "AutoVoucher-Setup-${{ steps.release.outputs.version }}-windows-x64.exe"
          )) {
            $localFile = if ($file.StartsWith("AutoVoucherLauncher-")) { "release\AutoVoucherLauncher.exe" } else { "release\$file" }
            $expected = (Get-Item $localFile).Length
            $response = Invoke-WebRequest -UseBasicParsing -Method Head "$base/$channel/$file"
            $contentLength = $response.Headers["Content-Length"] | Select-Object -First 1
            if (-not $contentLength) { throw "Published response has no Content-Length for $file" }
            if ([int64]$contentLength -ne $expected) { throw "Published size mismatch for $file" }
          }

      - name: Publish verified public installer alias
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        run: |
          $channel = "${{ steps.release.outputs.channel }}"
          $version = "${{ steps.release.outputs.version }}"
          $setup = "release\AutoVoucher-Setup-$version-windows-x64.exe"
          $prefix = $env:AUTO_VOUCHER_R2_PREFIX.Trim("/")
          $alias = "$prefix/$channel/AutoVoucher-Setup-windows-x64.exe"
          $endpoint = "https://$env:CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3api put-object --no-cli-pager --endpoint-url $endpoint --bucket $env:AUTO_VOUCHER_R2_BUCKET --key $alias --body $setup --content-type "application/vnd.microsoft.portable-executable" --cache-control "no-store"
          if ($LASTEXITCODE -ne 0) { throw "R2 public installer alias upload failed" }
          $download = Join-Path $env:RUNNER_TEMP "AutoVoucher-Setup-readback.exe"
          Invoke-WebRequest -UseBasicParsing "$($env:AUTO_VOUCHER_PUBLIC_UPDATE_BASE_URL.TrimEnd('/'))/$channel/AutoVoucher-Setup-windows-x64.exe" -OutFile $download
          $expected = (Get-FileHash $setup -Algorithm SHA256).Hash
          $actual = (Get-FileHash $download -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Public installer alias hash mismatch" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AutoVoucher-windows-launcher-candidate
          retention-days: 30
          path: |
            release/AutoVoucherLauncher.exe
            release/AutoVoucher-Setup-*.exe
            release/AutoVoucherCore-*.zip
            release/AutoVoucherOCR-*.zip
            release/AutoVoucherPDF-*.zip
            release/manifest.json
            release/manifest.json.sig
          if-no-files-found: error
