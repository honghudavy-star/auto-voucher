name: Windows source release

on:
  workflow_dispatch:
  push:
    tags:
      - "source-v*"

concurrency:
  group: auto-voucher-windows-source-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/source-v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME -replace '^source-v', ''
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion"
          }
          $mainSha = (git rev-parse origin/main).Trim()
          if ($env:GITHUB_SHA -ne $mainSha) {
            throw "Source release tag must point to the current origin/main commit"
          }

      - run: npm ci
      - name: Install locked Python environment
        run: |
          python -m pip install --upgrade pip==26.1.2 uv==0.10.11
          uv sync --frozen --all-extras
      - run: npm test
      - name: Test Python backend
        env:
          PYTHONPATH: backend
        run: uv run --frozen --all-extras python -m unittest discover -s backend/tests -v
      - run: npm run build

      - name: Build user-facing source bundle
        shell: pwsh
        run: |
          .\scripts\build-windows-source-bundle.ps1 -OutputPath release\Auto-Voucher-Windows.zip

      - name: Verify ZIP layout and Windows line endings
        shell: pwsh
        run: |
          $expanded = Join-Path $env:RUNNER_TEMP "auto-voucher-source-smoke"
          Expand-Archive -LiteralPath release\Auto-Voucher-Windows.zip -DestinationPath $expanded
          $topLevel = @(Get-ChildItem -LiteralPath $expanded | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object @("AutoVoucher", "Start-Auto-Voucher.bat") $topLevel) {
            throw "The ZIP root must contain only the user BAT and the internal folder"
          }
          foreach ($relativePath in @(
            "Start-Auto-Voucher.bat",
            "AutoVoucher\scripts\start-auto-voucher.bat"
          )) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $expanded $relativePath))
            $text = [Text.Encoding]::ASCII.GetString($bytes)
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) { throw "$relativePath must remain ASCII" }
            if ($text -notmatch "`r`n") { throw "$relativePath must use Windows CRLF line endings" }
          }
          $bundleRoot = Join-Path $expanded "AutoVoucher"
          $bootstrapScript = Join-Path $bundleRoot "scripts\environment-bootstrap.ps1"
          $bootstrapJob = Start-Job -ScriptBlock {
            param($ScriptPath, $RootPath)
            & $ScriptPath -Root $RootPath -Mode Serve -Port 18764
          } -ArgumentList $bootstrapScript, $bundleRoot
          try {
            $page = $null
            foreach ($attempt in 1..30) {
              try {
                $page = (Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18764/" -TimeoutSec 1).Content
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $page) { throw "Environment page did not start" }
            if ($page -notmatch 'id="action"') { throw "Automatic environment button is missing" }
            if ($page -match 'href="https://') { throw "Environment page must not render download links" }

            Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://127.0.0.1:18764/api/install" | Out-Null
            $state = $null
            foreach ($attempt in 1..30) {
              $state = Invoke-RestMethod -Uri "http://127.0.0.1:18764/api/status"
              if ($state.status -in @("ready", "error")) { break }
              Start-Sleep -Milliseconds 500
            }
            if ($state.status -ne "ready" -or $state.node -ne "ready" -or $state.python -ne "ready") {
              throw "Environment bootstrap did not reach ready state: $($state | ConvertTo-Json -Compress)"
            }
          } finally {
            foreach ($pidFileName in @("environment-install.pid", "environment-server.pid")) {
              $pidPath = Join-Path $bundleRoot ".auto-voucher-runtime\$pidFileName"
              if (Test-Path -LiteralPath $pidPath) {
                $processId = [int](Get-Content -LiteralPath $pidPath -Raw)
                Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
              }
            }
            Wait-Job -Job $bootstrapJob -Timeout 10 | Out-Null
            Remove-Job -Job $bootstrapJob -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Auto-Voucher-Windows-source
          path: release/Auto-Voucher-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub source release
        if: startsWith(github.ref, 'refs/tags/source-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            release\Auto-Voucher-Windows.zip `
            --title "Auto Voucher $env:GITHUB_REF_NAME Windows source" `
            --notes "Windows source release. Extract the ZIP, double-click Start-Auto-Voucher.bat, then click the automatic environment setup button. Auto Voucher continues after the local checks pass." `
            --latest
